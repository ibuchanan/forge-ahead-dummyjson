colors: false
output:
  - meta
  - summary
  - failure

pre-commit:
  commands:
    format:
      run: bun run format
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: lefthook run check

lint:
  parallel: true
  commands:
    check:
      run: bun run lint:check
    format:
      run: bun run format:check
    typecheck:
      run: bun run typecheck

check:
  commands:
    lint:
      run: lefthook run lint
    build:
      run: bun run pack:check
    test:
      run: bun run test

pack-lint:
  parallel: true
  commands:
    pack:
      run: bun pm pack --dry-run --ignore-scripts
    publint:
      run: publint --strict
    attw:
      run: attw --pack .
